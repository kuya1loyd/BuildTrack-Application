name: buildtrack
description: "BuildTrack — construction project management, Flutter edition."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  postgres: ^3.5.20
  provider: ^6.1.5
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  ionicons: 0.2.2
  intl: ^0.20.2
  uuid: ^4.6.0
  http: ^1.6.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
